<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Virtual Currency Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  body{background:#0f111a;color:#fff;font-family:Arial,sans-serif;margin:0}
  h1{color:#00ff88;margin:20px 0 10px;text-align:left;padding-left:5vw}
  .controls{margin:6px 5vw;text-align:left}
  input,button{background:#1a1c2c;color:#00ff88;border:1px solid #00ff88;border-radius:4px;padding:6px 10px;font-size:1em;margin:4px}
  button:hover{background:#00ff88;color:#0f111a;cursor:pointer}
  .chart-container{position:relative;width:90vw;height:70vh;margin:20px auto;display:flex;flex-direction:column;gap:4px}
  .price-wrapper{position:relative;flex:2;min-height:0}
  .macd-wrapper{position:relative;flex:1;min-height:0}
  .price-wrapper canvas,.macd-wrapper canvas{width:100%!important;height:100%!important}
  .time{color:#aaa;font-size:.9em;margin-left:5vw}
  .map-container{position:relative;display:inline-block}
  .branch-line{position:absolute;height:2px;background:#fff;top:50%;left:100%;width:0;transition:width .45s ease}
  .branch-up,.branch-down{position:absolute;width:2px;height:0;background:#fff;transition:height .35s ease .45s}
  .branch-up{top:50%;left:calc(100% + 90px)}
  .branch-down{top:50%;left:calc(100% + 90px)}
  .input-up,.confirm-btn{position:absolute;left:calc(100% + 100px);opacity:0;pointer-events:none;transition:opacity .25s ease .8s}
  .input-up{top:calc(50% - 40px);width:250px}
  .confirm-btn{top:calc(50% + 18px)}
  .active .branch-line{width:90px}
  .active .branch-up,.active .branch-down{height:30px}
  .active .branch-up{top:calc(50% - 30px)}
  .active .branch-down{top:50%}
  .active .input-up,.active .confirm-btn{opacity:1;pointer-events:auto}
  .hover-box{position:absolute;right:12px;top:12px;background:rgba(17,17,26,.85);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:12px 16px;display:none;flex-direction:column;align-items:flex-start;gap:6px;max-width:90%;overflow:auto;pointer-events:none}
  .hover-line{font-size:14px;line-height:1.4;white-space:nowrap}
  .muted{color:#aaa}
  .field-label{color:#00ff88;font-weight:bold;width:100px;display:inline-block}
  .coin-cell{display:inline-block;width:120px;text-align:right;margin-left:6px}
</style>
</head>
<body>
<h1>Virtual Currency Price Trend</h1>
<div class="controls">
  <input id="coinInput" type="text"
         placeholder="Main coin / contract (ACA, fu2611)"/>
  <button onclick="loadPrimary()">Update Chart</button>
  <button onclick="setBar('1m')">1m</button>
  <button onclick="setBar('1H')">1h</button>
  <button onclick="setBar('1D')">1d</button>
  <button onclick="setBar('1W')">1w</button>
  <button id="smoothBtn" onclick="toggleSmooth()">Point Smooth</button>
  <div class="map-container" id="mapContainer">
    <button id="addBtn">Add Coin</button>
    <div class="branch-line"></div>
    <div class="branch-up"></div>
    <div class="branch-down"></div>
    <input class="input-up" id="newCoin" type="text"
           placeholder="BTC,RAY,fu2611,bu2610">
    <button class="confirm-btn" id="confirmBtn">Confirm</button>
  </div>
</div>
<div class="time" id="updateTime">Ready.</div>
<div class="chart-container">
  <div class="price-wrapper">
    <canvas id="coinChart"></canvas>
    <div id="hoverBox" class="hover-box">
      <div id="hoverTs" class="hover-line muted"></div>
      <div id="hoverCoins" class="hover-line"></div>
      <div id="hoverRows"></div>
    </div>
  </div>
  <div class="macd-wrapper"><canvas id="macdChart"></canvas></div>
</div>

<script>
// 填写你已有的 China Futures HTTPS 服务地址，不要在这里填写密码。
// 例如：https://your-futures.example.com
const CHINA_FUTURES_BASE = '';

const GREEN = '#00ff88';
const palette = [
  '#ff4c4c','#4c8cff','#ffb84c','#a64dff','#4dd2ff',
  '#ffd24d','#ff6ad5','#7cffd3','#ff7c43','#43ffd0'
];
const PERIODS = {
  '1m':60000, '1H':3600000,
  '1D':86400000, '1W':604800000
};
const PRODUCTS = {
  SHFE:'au ag cu al zn pb ni sn rb hc ss fu bu ru sp ao br wr',
  DCE:'a b c cs m y p i j jm jd l v pp eg eb pg rr lh fb bb',
  CZCE:'WH PM CF SR TA OI MA FG RM ZC SF SM CY AP CJ UR SA PF PK SH PX PR RI LR JR RS',
  CFFEX:'IF IH IC IM T TF TS TL',
  INE:'sc nr lu bc ec',
  GFEX:'si lc ps'
};
const catalog = new Map();
for(const [exchange, codes] of Object.entries(PRODUCTS)){
  for(const code of codes.split(' ')){
    catalog.set(code.toLowerCase(), {exchange, code});
  }
}

const $ = id => document.getElementById(id);
let currentBar = '1D';
let loadedBar = null;
let smoothMode = false;
let primarySymbol = null;
let lastBatch = [];
let assets = new Map();
let timestamps = [];
let generation = 0;
let busy = false;

function status(message, error=false){
  $('updateTime').textContent = message;
  $('updateTime').style.color = error ? '#ff8585' : '#aaa';
}
function fmt(value){
  if(value == null || !Number.isFinite(value)) return '–';
  if(value !== 0 && Math.abs(value) < .001) return value.toExponential(2);
  return value.toLocaleString('en-US', {maximumFractionDigits:5});
}
function rgba(hex, alpha){
  const value = parseInt(hex.slice(1),16);
  return `rgba(${value>>16},${(value>>8)&255},${value&255},${alpha})`;
}

function parseSymbol(value){
  const raw = String(value || '').trim();
  if(!raw) throw new Error('请输入币种或期货代码');

  const match = raw.match(/^(?:([a-z]+)\.)?([a-z]+)(\d{3,4})$/i);
  if(match){
    const product = catalog.get(match[2].toLowerCase());
    if(product || match[1]){
      if(!product) throw new Error('未知期货品种：'+match[2]);
      if(match[1] && match[1].toUpperCase() !== product.exchange){
        throw new Error('交易所与品种不匹配：'+raw);
      }
      let month = match[3];
      const mm = Number(month.slice(-2));
      if(mm < 1 || mm > 12) throw new Error('合约月份无效：'+raw);

      // 郑商所原生合约使用三位年月，例如 MA610。
      if(product.exchange === 'CZCE'){
        month = month.slice(-3);
      }else if(month.length !== 4){
        throw new Error('该交易所请使用四位年月，例如 fu2611');
      }
      const instrument = product.code + month;
      const key = product.exchange + '.' + instrument;
      return {
        key, label:key, kind:'future',
        exchange:product.exchange, instrument
      };
    }
  }

  const symbol = raw.toUpperCase().replace(/[-_/]?USDT$/,'');
  if(!/^[A-Z0-9]{2,24}$/.test(symbol)){
    throw new Error('无法识别代码：'+raw);
  }
  return {
    key:symbol, label:symbol+'/USDT',
    kind:'crypto', instrument:symbol+'-USDT'
  };
}

async function getJSON(url){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(),15000);
  try{
    const response = await fetch(url,{signal:controller.signal});
    if(!response.ok) throw new Error('HTTP '+response.status);
    return await response.json();
  }catch(error){
    if(error.name === 'AbortError') throw new Error('行情请求超时');
    throw error;
  }finally{
    clearTimeout(timer);
  }
}

async function fetchCandles(asset, bar){
  let rows;
  if(asset.kind === 'crypto'){
    const params = new URLSearchParams({
      instId:asset.instrument, bar, limit:'100'
    });
    const result = await getJSON(
      'https://www.okx.com/api/v5/market/candles?'+params
    );
    if(result.code !== '0'){
      throw new Error(result.msg || 'OKX 查询失败');
    }
    rows = (result.data || []).map(row=>({
      ts:Number(row[0]),
      o:Number(row[1]), h:Number(row[2]),
      l:Number(row[3]), c:Number(row[4]),
      // OKX 现货报价币成交额为第 8 个字段。
      qv:row[7] === undefined ? null : Number(row[7])
    }));
  }else{
    const base = CHINA_FUTURES_BASE.trim().replace(/\/+$/,'');
    if(!base){
      throw new Error(
        `${asset.label} 已识别；请先配置 CHINA_FUTURES_BASE 行情地址`
      );
    }
    if(!/^https:\/\//i.test(base)){
      throw new Error('GitHub Pages 请配置 HTTPS 期货行情地址');
    }

    // 现有接口最大支持日线间隔；周线用日线汇总。
    const params = new URLSearchParams({
      exchange:asset.exchange,
      inst_id:asset.instrument,
      interval_ms:String(bar === '1W' ? PERIODS['1D'] : PERIODS[bar]),
      limit:bar === '1W' ? '1000' : '100'
    });
    const result = await getJSON(base+'/api/data_kmap?'+params);
    if(!result.ok) throw new Error(result.error || '期货行情查询失败');

    rows = (result.data || []).map(row=>({
      ts:Number(row.ts),
      o:Number(row.open), h:Number(row.high),
      l:Number(row.low), c:Number(row.close),
      qv:row.quote_volume == null ? null : Number(row.quote_volume)
    }));
  }

  rows = rows.filter(row=>
    [row.ts,row.o,row.h,row.l,row.c].every(Number.isFinite)
  ).sort((a,b)=>a.ts-b.ts);
  rows = [...new Map(rows.map(row=>[row.ts,row])).values()];

  if(asset.kind === 'future' && bar === '1W'){
    const weekly = new Map();
    const day = 86400000;
    for(const row of rows){
      const local = new Date(row.ts + 8*3600000);
      const weekday = (local.getUTCDay()+6)%7;
      const start = Date.UTC(
        local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate()
      ) - weekday*day - 8*3600000;
      const previous = weekly.get(start);
      if(!previous){
        weekly.set(start,{...row,ts:start});
      }else{
        previous.h = Math.max(previous.h,row.h);
        previous.l = Math.min(previous.l,row.l);
        previous.c = row.c;
        previous.qv = previous.qv == null || row.qv == null
          ? null : previous.qv + row.qv;
      }
    }
    rows = [...weekly.values()];
  }

  if(!rows.length) throw new Error(asset.label+' 暂无行情数据');
  return rows.slice(-60);
}

const chart = new Chart($('coinChart'),{
  type:'line',
  data:{labels:[],datasets:[]},
  options:{
    responsive:true, maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{
      legend:{
        labels:{
          color:'#fff',
          filter:(item,data)=>data.datasets[item.datasetIndex].type==='line'
        }
      },
      tooltip:{enabled:false}
    },
    scales:{x:{display:false}}
  }
});
const macdChart = new Chart($('macdChart'),{
  type:'line',
  data:{labels:[],datasets:[]},
  options:{
    responsive:true, maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{
      legend:{labels:{color:'#fff'}},
      tooltip:{enabled:false}
    },
    scales:{
      x:{
        ticks:{color:'#aaa',maxRotation:60,minRotation:45},
        grid:{display:false}
      },
      y:{
        ticks:{color:'#fff'},
        grid:{color:'rgba(255,255,255,.08)'}
      }
    }
  }
});

function ema(values, period){
  const k=2/(period+1);
  let previous=null;
  return values.map(value=>{
    previous = previous===null ? value : value*k+previous*(1-k);
    return previous;
  });
}

function render(){
  $('hoverBox').style.display='none';
  timestamps = [...new Set(
    [...assets.values()].flatMap(asset=>asset.candles.map(row=>row.ts))
  )].sort((a,b)=>a-b);

  const labels=timestamps.map(ts=>new Date(ts).toLocaleString());
  const datasets=[];
  const scales={x:{display:false}};

  [...assets.values()].forEach((asset,index)=>{
    const axis='price'+index;
    const volumeAxis='volume'+index;
    const candles=new Map(asset.candles.map(row=>[row.ts,row]));
    asset.byTime=candles;

    scales[axis]={
      type:'linear',position:'left',
      grid:{drawOnChartArea:index===0,color:'rgba(255,255,255,.08)'},
      ticks:{color:asset.color,callback:fmt}
    };
    scales[volumeAxis]={
      type:'linear',position:'right',beginAtZero:true,
      grid:{drawOnChartArea:false},
      ticks:{
        color:asset.color,
        callback:value=>value>=1e9?(value/1e9).toFixed(1)+'B':
          value>=1e6?(value/1e6).toFixed(1)+'M':
          value>=1e3?(value/1e3).toFixed(1)+'K':fmt(value)
      }
    };

    datasets.push({
      type:'bar',
      label:asset.label+' Amount',
      data:timestamps.map(ts=>candles.get(ts)?.qv ?? null),
      yAxisID:volumeAxis,
      backgroundColor:rgba(asset.color,.3),
      borderWidth:0,order:2
    },{
      type:'line',
      label:`${asset.label} (${loadedBar || currentBar})`,
      data:timestamps.map(ts=>candles.get(ts)?.c ?? null),
      yAxisID:axis,
      borderColor:asset.color,backgroundColor:'transparent',
      borderWidth:2,
      tension:smoothMode?.5:0,
      pointRadius:smoothMode?0:3,
      spanGaps:false,order:1
    });
  });

  chart.data={labels,datasets};
  chart.options.scales=scales;
  chart.update('none');
  renderMACD(labels);
}

function renderMACD(labels){
  const primary=assets.get(primarySymbol);
  macdChart.data={labels:[],datasets:[]};
  if(!primary){macdChart.update('none');return;}

  const closes=primary.candles.map(row=>row.c);
  const fast=ema(closes,12),slow=ema(closes,26);
  const dif=fast.map((value,index)=>value-slow[index]);
  const dea=ema(dif,9);
  const values=new Map();
  primary.candles.forEach((row,index)=>{
    values.set(row.ts,{
      dif:dif[index],dea:dea[index],
      buy:index>0&&dif[index-1]<=dea[index-1]&&dif[index]>dea[index],
      sell:index>0&&dif[index-1]>=dea[index-1]&&dif[index]<dea[index]
    });
  });

  const makeLine=(label,key,color)=>({
    type:'line',label,
    data:timestamps.map(ts=>values.get(ts)?.[key] ?? null),
    borderColor:color,borderWidth:1.5,
    pointRadius:0,tension:0,spanGaps:false
  });
  const makeCross=(label,key,color)=>({
    type:'line',label,showLine:false,
    data:timestamps.map(ts=>{
      const value=values.get(ts);
      return value?.[key]?value.dif:null;
    }),
    pointRadius:4,backgroundColor:color,borderColor:color
  });

  macdChart.data={
    labels,
    datasets:[
      makeLine('DIF','dif','#ffd700'),
      makeLine('DEA','dea','#ff4c4c'),
      makeCross('Golden Cross','buy',GREEN),
      makeCross('Dead Cross','sell','#ff6ad5')
    ]
  };
  macdChart.update('none');
}

// 请求按批次提交，旧请求不会覆盖新选择；失败保留之前的图。
async function commit(desired, primary, batch){
  const id=++generation;
  const bar=currentBar;
  busy=true;
  status('Loading…');
  try{
    const results=await Promise.all(
      [...desired.values()].map(async asset=>({
        ...asset,candles:await fetchCandles(asset,bar)
      }))
    );
    if(id!==generation) return;
    assets=new Map(results.map(asset=>[asset.key,asset]));
    primarySymbol=primary;
    lastBatch=batch;
    loadedBar=bar;
    $('addBtn').textContent=lastBatch.length?'Delete Coin':'Add Coin';
    render();
    status('Last updated: '+new Date().toLocaleTimeString());
  }catch(error){
    if(id===generation){
      status(error.message+'；原图保留。',true);
    }
  }finally{
    if(id===generation) busy=false;
  }
}

async function loadPrimary(){
  try{
    const raw=$('coinInput').value.trim();
    const desired=new Map(assets);
    if(primarySymbol) desired.delete(primarySymbol);
    if(!raw){
      ++generation;busy=false;
      assets=desired;primarySymbol=null;
      lastBatch=lastBatch.filter(key=>assets.has(key));
      $('addBtn').textContent=lastBatch.length?'Delete Coin':'Add Coin';
      render();status('Ready.');return;
    }
    const asset=parseSymbol(raw);
    desired.set(asset.key,{...asset,color:GREEN});
    await commit(
      desired,asset.key,
      lastBatch.filter(key=>key!==asset.key&&desired.has(key))
    );
  }catch(error){status(error.message,true);}
}

function setBar(bar){
  currentBar=bar;
  if(assets.size) commit(new Map(assets),primarySymbol,[...lastBatch]);
}
function toggleSmooth(){
  smoothMode=!smoothMode;
  render();
}

$('addBtn').onclick=()=>{
  if(lastBatch.length){
    ++generation;busy=false;
    lastBatch.forEach(key=>{
      if(key!==primarySymbol) assets.delete(key);
    });
    lastBatch=[];
    $('addBtn').textContent='Add Coin';
    $('mapContainer').classList.remove('active');
    render();
    status('Last batch removed.');
  }else{
    $('mapContainer').classList.toggle('active');
    if($('mapContainer').classList.contains('active')) $('newCoin').focus();
  }
};

$('confirmBtn').onclick=async()=>{
  try{
    const raw=$('newCoin').value.trim();
    if(!raw)return;
    const entries=raw.split(/[,，\s]+/).filter(Boolean).map(parseSymbol);
    const desired=new Map(assets);
    const batch=[];
    for(const asset of entries){
      if(desired.has(asset.key))continue;
      const color=palette[desired.size%palette.length];
      desired.set(asset.key,{...asset,color});
      batch.push(asset.key);
    }
    if(!batch.length){status('这些标的已经在图中。');return;}
    await commit(desired,primarySymbol,batch);
  }catch(error){status(error.message,true);}
};

$('coinInput').onkeydown=event=>{
  if(event.key==='Enter')loadPrimary();
};
$('newCoin').onkeydown=event=>{
  if(event.key==='Enter')$('confirmBtn').click();
};

chart.canvas.addEventListener('mousemove',event=>{
  if(smoothMode)return;
  const points=chart.getElementsAtEventForMode(
    event,'index',{intersect:false},true
  );
  if(!points.length){$('hoverBox').style.display='none';return;}
  const ts=timestamps[points[0].index];
  const list=[...assets.values()];
  $('hoverTs').textContent='Time: '+new Date(ts).toLocaleString();
  $('hoverCoins').replaceChildren();
  $('hoverRows').replaceChildren();

  const heading=document.createElement('span');
  heading.className='field-label';
  heading.textContent='Coins:';
  $('hoverCoins').append(heading);
  for(const asset of list){
    const cell=document.createElement('span');
    cell.className='coin-cell';
    cell.style.color=asset.color;
    cell.textContent=asset.label;
    $('hoverCoins').append(cell);
  }

  for(const [name,key] of [
    ['Open','o'],['High','h'],['Low','l'],
    ['Close','c'],['Amount','qv']
  ]){
    const row=document.createElement('div');
    row.className='hover-line';
    const label=document.createElement('span');
    label.className='field-label';
    label.textContent=name+':';
    row.append(label);
    for(const asset of list){
      const cell=document.createElement('span');
      cell.className='coin-cell';
      cell.style.color=asset.color;
      const value=asset.byTime?.get(ts)?.[key];
      cell.textContent=fmt(value);
      if(key==='qv'&&Number.isFinite(value)){
        cell.textContent+=' '+(asset.kind==='future'?'CNY':'USDT');
      }
      row.append(cell);
    }
    $('hoverRows').append(row);
  }
  $('hoverBox').style.display='flex';
});
chart.canvas.addEventListener('mouseleave',()=>{
  $('hoverBox').style.display='none';
});

setInterval(()=>{
  if(!document.hidden&&!busy&&assets.size){
    commit(new Map(assets),primarySymbol,[...lastBatch]);
  }
},10000);
</script>
</body>
</html>
